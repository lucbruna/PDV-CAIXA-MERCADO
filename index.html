<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="description" content="Sudam Gestão — sistema de frente de caixa e gestão para mercadinho. PDV, estoque, crediário, financeiro e relatórios.">
<title>Sudam Gestão · PDV</title>

<!-- Precisa ser o PRIMEIRO script da pagina: e o boot.js que fica ouvindo os
     erros dos scripts seguintes. Ele nasceu dentro deste arquivo e foi movido
     para js/boot.js porque a politica de seguranca do servidor manda
     `script-src 'self'`, sem 'unsafe-inline': um <script> escrito aqui dentro
     e bloqueado pelo navegador. Ver o comentario no topo de js/boot.js. -->
<script src="js/boot.js"></script>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/vertice.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2310b981'/%3E%3Ctext y='74' x='50' text-anchor='middle' font-size='58'%3E%F0%9F%9B%92%3C/text%3E%3C/svg%3E">
</head>
<body>

<!-- tela de login (preenchida por app.js). Nasce escondida: o overlay é opaco e
     cobre a tela toda, então o padrão tem que ser "fora da frente". app.js
     remove o .hidden via showLogin() quando não há sessão salva. -->
<div id="authScreen" class="auth hidden"></div>

<!-- shell do sistema (preenchido por app.js) -->
<div id="app" class="app"></div>

<input type="file" id="importFile" accept=".json,application/json" style="display:none">

<!-- dependências -->
<script src="js/api.js"></script>
<script src="js/store.js"></script>
<script src="js/qr.js"></script>
<script src="js/ui.js"></script>
<script src="js/pdv.js"></script>
<script src="js/app.js"></script>

</body>
</html>
